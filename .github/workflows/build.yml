on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Check jar
        run: |
          ls -la build/libs
          unzip -tq build/libs/wetsuki.jar

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: Wetsuki
          path: build/libs/wetsuki.jar
          compression-level: 0
          if-no-files-found: error
